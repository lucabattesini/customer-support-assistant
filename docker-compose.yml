services:
  backend:
    build: ./back-end
    env_file:
      - path: ./back-end/.env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////app/data/app.db}
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
