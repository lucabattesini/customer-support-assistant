services:
  backend:
    build: ./back-end
    env_file:
      - path: ./back-end/.env
        required: false
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the root .env}
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in the root .env}:8000"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_URL: ${FRONTEND_API_URL:?Set FRONTEND_API_URL in the root .env}
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT in the root .env}:80"
    depends_on:
      - backend

volumes:
  backend-data:
